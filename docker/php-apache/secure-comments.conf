ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^/(.*)$ https://localhost:__EXTERNAL_HTTPS_PORT__/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/clo2-selfsigned.crt
    SSLCertificateKeyFile /etc/apache2/ssl/clo2-selfsigned.key
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'"

    LimitRequestBody 1048576

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/secure-comments-error.log
    CustomLog ${APACHE_LOG_DIR}/secure-comments-access.log combined
</VirtualHost>
